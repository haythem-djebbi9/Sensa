# Services d'infrastructure pour un environnement proche de la production.
#   docker compose up -d
# puis dans .env : POSTGRES_DB=sensa, REDIS_URL=redis://localhost:6379/0, USE_MINIO=1
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sensa
      POSTGRES_USER: sensa
      POSTGRES_PASSWORD: sensa
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sensa-media"

volumes:
  postgres-data:
  minio-data:
