{% extends "layouts/app.html" %}
{% load sensa_tags %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<main class="page narrow-page">
  <a class="back-link" href="{{ cancel_url }}"><span class="back-arrow">←</span>Retour</a>
  <form method="post" class="card form-card">
    {% csrf_token %}
    <div class="alert alert-danger">{% icon "trash" %}<div><strong>{{ title }}</strong>{{ description }}</div></div>
    {% if consequences %}<p class="muted">{{ consequences }}</p>{% endif %}
    <div class="form-actions">
      <a class="btn btn-ghost" href="{{ cancel_url }}">Annuler</a>
      <button type="submit" class="btn btn-danger">{% icon "trash" 16 %}Supprimer</button>
    </div>
  </form>
</main>
{% endblock %}
