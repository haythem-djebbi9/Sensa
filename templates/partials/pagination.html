{% load sensa_tags %}
{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page.has_previous %}
      <a class="btn btn-secondary btn-small" href="?{% query_transform page=page.previous_page_number %}">← Précédent</a>
    {% endif %}
    <span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a class="btn btn-secondary btn-small" href="?{% query_transform page=page.next_page_number %}">Suivant →</a>
    {% endif %}
  </nav>
{% endif %}
