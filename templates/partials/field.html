<label class="field{% if field.errors %} field-invalid{% endif %}"{% if hidden %} id="{{ wrapper_id }}" hidden{% endif %}>
  <span>{{ field.label }}{% if not field.field.required %} <small>(facultatif)</small>{% endif %}</span>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</label>
