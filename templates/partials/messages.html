{% load sensa_tags %}
<div class="messages" aria-live="polite">
  {% for message in messages %}
    <div class="toast toast-{{ message.level_tag|default:'info' }}" role="status">
      {% if message.level_tag == "success" %}{% icon "check" %}{% elif message.level_tag == "error" or message.level_tag == "warning" %}{% icon "alert" %}{% else %}{% icon "bell" %}{% endif %}
      <p>{{ message }}</p>
      <button type="button" class="toast-close" aria-label="Fermer">×</button>
    </div>
  {% endfor %}
</div>
