{% extends "base.html" %}
{% load sensa_tags %}
{% block title %}Page introuvable{% endblock %}
{% block body %}
<main class="page error-page" id="contenu">
  <div>
    {% logo %}
    <span class="eyebrow" style="margin-top:2rem">Erreur 404</span>
    <h1>Cette page s'est envolée</h1>

  </div>
</main>
{% endblock %}
