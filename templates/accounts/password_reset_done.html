{% extends "layouts/auth.html" %}
{% block title %}E-mail envoyé{% endblock %}
{% block form %}
<div class="auth-form">
  <div>
    <span class="eyebrow">Vérifiez vos e-mails</span>
    <h2>Lien envoyé</h2>
    <p>Si un compte correspond à cette adresse, vous recevrez un e-mail avec un lien pour choisir un nouveau mot de passe.</p>
  </div>
  <a class="btn btn-secondary full-button" href="{% url 'accounts:login' %}">Retour à la connexion</a>
</div>
{% endblock %}
